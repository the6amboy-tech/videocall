<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karthik Global Video</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #020617; color: white; font-family: sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        video { border-radius: 1rem; background: #000; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .hidden { display: none; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div id="setup-screen" class="w-full max-w-sm glass p-8 rounded-3xl text-center shadow-2xl">
        <h1 class="text-3xl font-black mb-2 italic text-blue-500">KARTHIK EDITS</h1>
        <p class="text-slate-400 text-sm mb-8">Global Video Call (P2P + Relay)</p>

        <input type="text" id="room-id" placeholder="Enter Room Code" 
            class="w-full bg-slate-900 border border-white/10 rounded-xl px-4 py-4 mb-6 text-center text-xl outline-none focus:border-blue-500 transition-all">
        
        <div class="space-y-3">
            <button onclick="startCall('host')" class="w-full bg-blue-600 hover:bg-blue-500 py-4 rounded-xl font-bold transition-all">Create Room</button>
            <button onclick="startCall('guest')" class="w-full bg-slate-800 hover:bg-slate-700 py-4 rounded-xl font-bold transition-all border border-white/5">Join Room</button>
        </div>
    </div>

    <div id="call-screen" class="hidden fixed inset-0 flex flex-col p-4 bg-black">
        <div id="status" class="text-center py-2 text-xs font-bold uppercase tracking-widest text-blue-400">Initializing...</div>
        
        <div class="flex-1 grid grid-cols-1 md:grid-cols-2 gap-4 max-w-6xl mx-auto w-full">
            <div class="relative overflow-hidden rounded-2xl border border-white/10 bg-slate-900">
                <video id="remote-video" autoplay playsinline></video>
                <span class="absolute bottom-4 left-4 text-[10px] bg-black/50 px-2 py-1 rounded uppercase">Remote Peer</span>
            </div>
            <div class="relative overflow-hidden rounded-2xl border border-white/10 bg-slate-900">
                <video id="local-video" autoplay muted playsinline></video>
                <span class="absolute bottom-4 left-4 text-[10px] bg-black/50 px-2 py-1 rounded uppercase">You</span>
            </div>
        </div>

        <div class="py-6 flex justify-center">
            <button onclick="location.reload()" class="w-16 h-16 bg-red-600 rounded-full flex items-center justify-center hover:bg-red-500 transition-all">
                <i class="fas fa-phone-slash text-xl"></i>
            </button>
        </div>
    </div>

    <script>
        let peer, localStream;

        // Global ICE Servers (STUN + Free TURN from OpenRelay)
        const iceConfig = {
            'iceServers': [
                { 'urls': 'stun:stun.l.google.com:19302' },
                { 'urls': 'stun:openrelay.metered.ca:80' },
                {
                    'urls': 'turn:openrelay.metered.ca:80',
                    'username': 'openrelayproject',
                    'credential': 'openrelayproject'
                },
                {
                    'urls': 'turn:openrelay.metered.ca:443',
                    'username': 'openrelayproject',
                    'credential': 'openrelayproject'
                }
            ]
        };

        async function startCall(role) {
            const code = document.getElementById('room-id').value.trim();
            if (!code) return alert("Please enter a code");

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('local-video').srcObject = localStream;
                document.getElementById('setup-screen').classList.add('hidden');
                document.getElementById('call-screen').classList.remove('hidden');

                const hostId = 'k-global-host-' + code;
                const guestId = 'k-global-guest-' + code;

                if (role === 'host') {
                    peer = new Peer(hostId, { config: iceConfig });
                    document.getElementById('status').innerText = "Waiting for remote connection...";
                    
                    peer.on('call', (call) => {
                        document.getElementById('status').innerText = "Connecting...";
                        call.answer(localStream);
                        call.on('stream', (remoteStream) => {
                            document.getElementById('remote-video').srcObject = remoteStream;
                            document.getElementById('status').innerText = "Live • Global Relay Active";
                        });
                    });
                } else {
                    peer = new Peer(guestId, { config: iceConfig });
                    document.getElementById('status').innerText = "Searching for host...";
                    
                    peer.on('open', () => {
                        const call = peer.call(hostId, localStream);
                        call.on('stream', (remoteStream) => {
                            document.getElementById('remote-video').srcObject = remoteStream;
                            document.getElementById('status').innerText = "Live • Global Relay Active";
                        });
                    });
                }

                peer.on('error', (err) => {
                    console.error(err);
                    alert("Connection failed. Tip: Make sure the host creates the room first!");
                });

            } catch (e) {
                alert("Camera Error: Please check permissions.");
            }
        }
    </script>
</body>
</html>

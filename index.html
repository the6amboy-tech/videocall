<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karthik Fast-Call</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #050505; color: white; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .glass { background: rgba(20, 20, 20, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
        video { border-radius: 1.25rem; background: #111; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); border: 1px solid rgba(255,255,255,0.1); }
        .hidden { display: none; }
        .pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 overflow-hidden">

    <div class="fixed inset-0 pointer-events-none">
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-blue-500/5 rounded-full blur-[120px]"></div>
    </div>

    <div id="setup-screen" class="relative z-10 w-full max-w-sm glass p-8 rounded-[2rem] shadow-2xl text-center">
        <h1 class="text-2xl font-bold mb-1">Karthik Chat</h1>
        <p class="text-slate-500 text-xs mb-8 uppercase tracking-[0.2em]">Ultra-Fast Connection</p>

        <input type="text" id="room-input" placeholder="Room Code" 
            class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-4 mb-6 text-center text-xl font-mono focus:border-blue-500 outline-none transition-all">
        
        <div class="space-y-3">
            <button onclick="initCall('host')" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl transition-all active:scale-95">
                Create Room
            </button>
            <button onclick="initCall('guest')" class="w-full bg-white/5 hover:bg-white/10 text-white font-bold py-4 rounded-xl border border-white/10 transition-all active:scale-95">
                Join Room
            </button>
        </div>
    </div>

    <div id="video-screen" class="hidden fixed inset-0 z-20 p-4 flex flex-col items-center">
        <div id="status-bar" class="bg-blue-600/20 text-blue-400 px-4 py-1 rounded-full text-[10px] font-bold uppercase tracking-widest mb-4 pulse">
            Connecting...
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 w-full max-w-5xl flex-1">
            <div class="relative">
                <video id="remote-video" autoplay playsinline></video>
                <div class="absolute bottom-4 left-4 bg-black/60 px-3 py-1 rounded-md text-[10px] font-bold uppercase">Remote</div>
            </div>
            <div class="relative">
                <video id="local-video" autoplay muted playsinline></video>
                <div class="absolute bottom-4 left-4 bg-black/60 px-3 py-1 rounded-md text-[10px] font-bold uppercase">You</div>
            </div>
        </div>
        
        <div class="mt-6">
            <button onclick="location.reload()" class="w-16 h-16 bg-red-600 hover:bg-red-500 rounded-full flex items-center justify-center shadow-lg transition-all active:scale-90">
                <i class="fas fa-phone-slash text-xl"></i>
            </button>
        </div>
    </div>

    <script>
        let peer, localStream;
        const roomInput = document.getElementById('room-input');
        const statusBar = document.getElementById('status-bar');

        // High-speed configuration using global STUN servers
        const peerConfig = {
            config: {
                'iceServers': [
                    { url: 'stun:stun.l.google.com:19302' },
                    { url: 'stun:stun1.l.google.com:19302' }
                ]
            }
        };

        async function initCall(role) {
            const code = roomInput.value.trim();
            if (!code) return alert("Enter code");

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 1280, height: 720 }, 
                    audio: true 
                });
                document.getElementById('local-video').srcObject = localStream;
                
                document.getElementById('setup-screen').classList.add('hidden');
                document.getElementById('video-screen').classList.remove('hidden');

                const hostID = 'k-fast-host-' + code;
                const guestID = 'k-fast-guest-' + code;

                if (role === 'host') {
                    peer = new Peer(hostID, peerConfig);
                    statusBar.innerText = "Waiting for guest...";
                    
                    peer.on('call', (call) => {
                        statusBar.innerText = "Guest Joining...";
                        call.answer(localStream);
                        handleStream(call);
                    });
                } else {
                    peer = new Peer(guestID, peerConfig);
                    statusBar.innerText = "Searching for host...";
                    
                    peer.on('open', () => {
                        const call = peer.call(hostID, localStream);
                        handleStream(call);
                    });
                }

                peer.on('error', (err) => {
                    console.error(err);
                    alert("Connection error. Ensure the host has created the room first.");
                    location.reload();
                });

            } catch (err) {
                alert("Please allow camera access.");
            }
        }

        function handleStream(call) {
            call.on('stream', (stream) => {
                document.getElementById('remote-video').srcObject = stream;
                statusBar.innerText = "Live";
                statusBar.classList.remove('pulse');
                statusBar.classList.replace('bg-blue-600/20', 'bg-emerald-600/20');
                statusBar.classList.replace('text-blue-400', 'text-emerald-400');
            });
        }
    </script>
</body>
</html>

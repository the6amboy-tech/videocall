<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karthik Video Fix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; }
        video { width: 100%; height: 100%; object-fit: cover; border-radius: 1rem; transform: scaleX(-1); background: #111; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div id="setup" class="w-full max-w-sm glass p-8 rounded-3xl text-center z-10">
        <h2 class="text-xl font-bold mb-6">Karthik Call</h2>
        <input type="text" id="code" placeholder="Room Code" class="w-full bg-black/40 border border-white/20 p-4 rounded-xl mb-4 text-center text-xl outline-none focus:border-blue-500">
        <button onclick="connect('host')" class="w-full bg-blue-600 p-4 rounded-xl font-bold mb-2">Create Room</button>
        <button onclick="connect('guest')" class="w-full bg-white/10 p-4 rounded-xl font-bold border border-white/10">Join Room</button>
    </div>

    <div id="interface" class="hidden fixed inset-0 p-4 flex flex-col gap-4 bg-black">
        <div class="flex-1 grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="relative">
                <video id="remote-v" autoplay playsinline></video>
                <div class="absolute bottom-4 left-4 text-[10px] bg-black/60 px-2 py-1 rounded">Remote User</div>
            </div>
            <div class="relative">
                <video id="local-v" autoplay muted playsinline></video>
                <div class="absolute bottom-4 left-4 text-[10px] bg-black/60 px-2 py-1 rounded">You</div>
            </div>
        </div>
        <button onclick="location.reload()" class="mx-auto w-16 h-16 bg-red-600 rounded-full flex items-center justify-center">
            <i class="fas fa-phone-slash text-white"></i>
        </button>
    </div>

    <script>
        let peer, localStream;
        const ice = { 'iceServers': [{ 'urls': 'stun:stun.l.google.com:19302' }, { 'urls': 'stun:stun1.l.google.com:19302' }] };

        async function connect(role) {
            const id = document.getElementById('code').value;
            if(!id) return alert("Enter code");

            try {
                // 1. Get stream FIRST to ensure it's ready before signaling
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('local-v').srcObject = localStream;
                
                document.getElementById('setup').classList.add('hidden');
                document.getElementById('interface').classList.remove('hidden');

                const hID = 'vid-h-' + id;
                const gID = 'vid-g-' + id;

                if(role === 'host') {
                    peer = new Peer(hID, { config: ice });
                    peer.on('call', (call) => {
                        call.answer(localStream); // Send my video back
                        call.on('stream', (s) => document.getElementById('remote-v').srcObject = s);
                    });
                } else {
                    peer = new Peer(gID, { config: ice });
                    peer.on('open', () => {
                        const call = peer.call(hID, localStream); // Call host with my video
                        call.on('stream', (s) => document.getElementById('remote-v').srcObject = s);
                    });
                }
            } catch (e) { alert("Enable Camera Access!"); }
        }
    </script>
</body>
</html>
